name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: halfway-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release inputs
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$SPARKLE_PRIVATE_KEY"

      - name: Install tools
        run: |
          brew install xcodegen
          scripts/fetch-sparkle-tools
          python3 scripts/check-release-config.py

      - name: Write Last.fm credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          test -n "$LASTFM_API_KEY" && test -n "$LASTFM_API_SECRET"
          printf 'LASTFM_API_KEY = %s\nLASTFM_API_SECRET = %s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" \
            > Config/Secrets.xcconfig
          xcodegen generate

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # Export re-signs Sparkle's nested XPC services and helpers with our Developer ID.
      - name: Archive and export
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild archive -project Halfway.xcodeproj -scheme Halfway -configuration Release \
            -derivedDataPath "$HOME/DerivedData/halfway-slot-0" -archivePath "$RUNNER_TEMP/Halfway.xcarchive" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Halfway.xcarchive" \
            -exportOptionsPlist packaging/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
          APP_PATH="$RUNNER_TEMP/export/Halfway.app"
          codesign --verify --deep --strict "$APP_PATH"
          lipo "$APP_PATH/Contents/MacOS/Halfway" -verify_arch arm64
          lipo "$APP_PATH/Contents/MacOS/Halfway" -verify_arch x86_64
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Notarize app
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          umask 077
          printf '%s' "$API_KEY" > "$KEY_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Halfway.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Halfway.zip" \
            --key "$KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Create DMG
        run: |
          mkdir -p build/release
          DMG_PATH="$PWD/build/release/Halfway-${GITHUB_REF_NAME}.dmg"
          scripts/build-dmg "$APP_PATH" "$DMG_PATH"
          codesign --sign "Developer ID Application" --timestamp \
            --identifier com.patrickdugan.halfway.dmg "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        env:
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict "$DMG_PATH"

      - name: Sign and validate update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          scripts/generate-update-feed "$PWD/build/release" "$GITHUB_REF_NAME"
          swift scripts/verify-update-feed.swift build/release/appcast.xml "$DMG_PATH" \
            "$APP_PATH/Contents/Info.plist" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

      # Create privately, upload both assets, then publish so latest never points at an incomplete release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-release "$GITHUB_REF_NAME" "$DMG_PATH" build/release/appcast.xml

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f Config/Secrets.xcconfig "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"
