name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat xcbeautify actionlint

      - name: Format, lint, build and test
        run: |
          xcodebuild -version
          swift --version
          if ! scripts/check CODE_SIGNING_ALLOWED=NO; then
            if test -f build/xcodebuild-check.log; then
              cat build/xcodebuild-check.log
            fi
            exit 1
          fi
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
