name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat xcbeautify actionlint

      - name: Format, lint, build and test
        run: scripts/check CODE_SIGNING_ALLOWED=NO
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
